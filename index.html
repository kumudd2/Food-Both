  <!-- Global Error Handler -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error("Cafeteria Error:", msg, line, error);
      var box = document.getElementById('debug-error-box');
      if (!box && document.body) {
        box = document.createElement('div');
        box.id = 'debug-error-box';
        box.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;background:#fee2e2;color:#991b1b;padding:16px;border:2px solid #ef4444;border-radius:12px;font-family:sans-serif;font-size:12px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
        document.body.appendChild(box);
      }
      if (box) {
        box.innerHTML = '<strong>App Warning:</strong> ' + msg + ' (Line ' + line + ')<br><small style="color:#b91c1c;">Open Developer Console (F12) for full trace.</small>';
      }
    };
  </script>

// Zero-dependency Web Audio API synthesizer for tactile UI sounds
window.SoundFX = {
  enabled: true,
  ctx: null,

  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },

  play(type) {
    if (!this.enabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'add') {
        // High cheery pop
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'click') {
        // Subtle micro-click
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.start(t);
        osc.stop(t + 0.05);
      } else if (type === 'remove') {
        // Downward tone
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(240, t + 0.09);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t);
        osc.stop(t + 0.1);
      } else if (type === 'success') {
        // 4-note ascending fanfare
        [
          { f: 523.25, time: 0 },
          { f: 659.25, time: 0.1 },
          { f: 783.99, time: 0.2 },
          { f: 1046.50, time: 0.3 }
        ].forEach(note => {
          const nOsc = this.ctx.createOscillator();
          const nGain = this.ctx.createGain();
          nOsc.type = 'triangle';
          nOsc.frequency.setValueAtTime(note.f, t + note.time);
          nGain.gain.setValueAtTime(0.12, t + note.time);
          nGain.gain.exponentialRampToValueAtTime(0.001, t + note.time + 0.25);
          nOsc.connect(nGain);
          nGain.connect(this.ctx.destination);
          nOsc.start(t + note.time);
          nOsc.stop(t + note.time + 0.25);
        });
      }
    } catch (e) {
      // Audio not permitted or unsupported, fail gracefully
    }
  }
};

// Smart Cafeteria Frontend-to-Backend API Client
// Connects the React UI to the Python Flask REST API & SQLite Database (cafeteria.db)

window.CafeteriaAPI = {
  // Automatically choose endpoint: relative /api if served by Flask, otherwise absolute localhost
  baseUrl: window.location.origin.includes(':5000') ? '/api' : 'http://127.0.0.1:5000/api',
  isOnline: false,
  statusListeners: [],

  onStatusChange(cb) {
    this.statusListeners.push(cb);
  },

  notifyStatus(status) {
    this.isOnline = status;
    this.statusListeners.forEach(cb => {
      try { cb(status); } catch (e) {}
    });
  },

  async init() {
    try {
      const res = await fetch(`${this.baseUrl}/health`, { method: 'GET', mode: 'cors' });
      if (res.ok) {
        const data = await res.json();
        this.notifyStatus(true);
        console.log("🟢 Connected to Python Flask Backend & SQLite (cafeteria.db):", data);
        return true;
      }
    } catch (e) {
      this.notifyStatus(false);
      console.log("🟡 Flask backend offline or disconnected. Running in client-side state mode.");
      return false;
    }
  },

  async getMenu(params = {}) {
    if (!this.isOnline) return window.CafeteriaData.foodItems;
    try {
      const qs = new URLSearchParams(params).toString();
      const res = await fetch(`${this.baseUrl}/menu?${qs}`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return (data.items && data.items.length) ? data.items : window.CafeteriaData.foodItems;
    } catch (e) {
      return window.CafeteriaData.foodItems;
    }
  },

  async getCategories() {
    if (!this.isOnline) return window.CafeteriaData.categories;
    try {
      const res = await fetch(`${this.baseUrl}/categories`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.categories || window.CafeteriaData.categories;
    } catch (e) {
      return window.CafeteriaData.categories;
    }
  },

  async getPickupSlots() {
    if (!this.isOnline) return window.CafeteriaData.pickupSlots;
    try {
      const res = await fetch(`${this.baseUrl}/slots`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.slots || window.CafeteriaData.pickupSlots;
    } catch (e) {
      return window.CafeteriaData.pickupSlots;
    }
  },

  async createOrder(payload) {
    if (!this.isOnline) {
      console.log("Offline mode: creating local mock order");
      return null;
    }
    try {
      const res = await fetch(`${this.baseUrl}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`HTTP error ${res.status}`);
      const data = await res.json();
      return data.order;
    } catch (e) {
      console.error("Failed to place order to Flask backend:", e);
      return null;
    }
  },

  async getOrders(userId = null) {
    if (!this.isOnline) return window.CafeteriaData.defaultOrders;
    try {
      const url = userId ? `${this.baseUrl}/orders?user_id=${userId}` : `${this.baseUrl}/orders`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return (data.orders && data.orders.length) ? data.orders : window.CafeteriaData.defaultOrders;
    } catch (e) {
      return window.CafeteriaData.defaultOrders;
    }
  },

  async updateOrderStatus(orderId, status) {
    if (!this.isOnline) return { order_id: orderId, status };
    try {
      const res = await fetch(`${this.baseUrl}/orders/${orderId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.order;
    } catch (e) {
      console.error("Failed to update status on Flask backend:", e);
      return null;
    }
  },

  async getWallet(userId = null) {
    if (!this.isOnline) return null;
    try {
      const url = userId ? `${this.baseUrl}/wallet?user_id=${userId}` : `${this.baseUrl}/wallet`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.wallet;
    } catch (e) {
      return null;
    }
  },

  async rechargeWallet(amount, mode = 'UPI Gateway') {
    if (!this.isOnline) return { success: true, new_balance: 480 + amount };
    try {
      const res = await fetch(`${this.baseUrl}/wallet/recharge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, mode })
      });
      if (!res.ok) throw new Error('API error');
      return await res.json();
    } catch (e) {
      console.error("Failed to recharge wallet on Flask backend:", e);
      return null;

        year: 1,
        diet: payload.diet || 'veg',
        walletBalance: 500.00,
        rewardPoints: 100,
        avatar: 'assets/avatar.jpg'
      };
      return { success: true, user: localUser };
    }
    try {
      const res = await fetch(`${this.baseUrl}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      return data;
    } catch (e) {
      return { success: false, message: e.message };
    }
  },

  async getAvailableUsers() {
    if (!this.isOnline) return [];
    try {
      const res = await fetch(`${this.baseUrl}/auth/users`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.users || [];
    } catch (e) {
      return [];
    }
  },

  async checkDetailedHealth() {
    const start = performance.now();
    try {
      const res = await fetch(`${this.baseUrl}/health`);
      const latency = Math.round(performance.now() - start);
      if (res.ok) {
        const data = await res.json();
        return {
          online: true,
          latency: `${latency}ms`,
          status: data.status,
          database: data.database,
          platform: data.platform
        };
      }
      return { online: false, error: `HTTP ${res.status}` };
    } catch (e) {
      return { online: false, error: e.message };
    }
  },

  async login(email, password = 'password123', provider = 'credentials') {
    if (!this.isOnline) {
      return {
        success: true,
        user: window.CafeteriaData.userProfile
      };
    }
    try {
      const res = await fetch(`${this.baseUrl}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, provider })
      });
      if (!res.ok) throw new Error('API error');
      return await res.json();
    } catch (e) {
      return { success: false, message: e.message };
    }
  },

  async getAdminStats() {
    if (!this.isOnline) return null;
    try {
      const res = await fetch(`${this.baseUrl}/admin/stats`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.stats;
    } catch (e) {
      return null;
    }
  },

  async getKitchenQueue() {

      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      return data.queue;
    } catch (e) {

                          item.description.toLowerCase().includes(searchQuery.toLowerCase());

      dietaryFilter === 'all' ||
      (dietaryFilter === 'veg' && item.isVeg) ||

      (dietaryFilter === 'chef' && item.isChefSpecial);
    return matchesCat && matchesSearch && matchesDiet;
  }).sort((a, b) => {
    if (sortBy === 'price-low') return a.price - b.price;
    if (sortBy === 'price-high') return b.price - a.price;

// 4. My Cart & Live Tray Page
function CartScreen({
  cartItems,
  onNavigate,
  onIncreaseQty,
  onDecreaseQty,
  onRemoveItem,
  onClearCart
}) {
  const [couponCode, setCouponCode] = React.useState('CAMPUS10');
  const [discountAmount, setDiscountAmount] = React.useState(10.00);
  const [staffTip, setStaffTip] = React.useState(0);
  const [ecoFriendly, setEcoFriendly] = React.useState(true);

  // Compute Bill Summary dynamically
  const subtotal = cartItems.reduce((acc, curr) => {
    const item = window.CafeteriaData.foodItems.find(f => f.id === curr.itemId);
    return acc + (item ? item.price * curr.quantity : 0);
  }, 0);
  const gst = subtotal * 0.05;
  const total = Math.max(0, subtotal + gst + staffTip - discountAmount);
  const totalCount = cartItems.reduce((acc, curr) => acc + curr.quantity, 0);

  const handleApplyCoupon = (code) => {
    if (code === 'CAMPUS10' || code === 'STUDENT50') {
      setCouponCode(code);
      setDiscountAmount(code === 'STUDENT50' ? 50 : 10);
      window.SoundFX.play('success');
      alert(`Coupon ${code} applied successfully!`);
    } else {
      alert('Invalid coupon code. Try CAMPUS10 or STUDENT50');
    }
  };

  return (
    <div className="max-w-5xl mx-auto space-y-6 animate-fade-in pb-12">
      <div className="flex items-center justify-between pb-3 border-b border-slate-200">
        <div>
          <h1 className="text-2xl font-black text-slate-900 tracking-tight">My Cafeteria Cart</h1>
          <p className="text-xs text-slate-500">
            {totalCount} {totalCount === 1 ? 'item' : 'items'} in your pre-order tray
          </p>
        </div>
        {cartItems.length > 0 && (
          <button
            onClick={onClearCart}
            className="text-xs font-bold text-red-500 hover:text-red-700 hover:underline"
          >
            Clear Tray
          </button>
        )}
      </div>

      {cartItems.length === 0 ? (
        <div className="bg-white rounded-3xl p-12 text-center border border-slate-200/80 shadow-xs max-w-md mx-auto space-y-4">
          <span className="text-6xl block">🛒</span>
          <h3 className="text-lg font-black text-slate-800">Your cafeteria tray is empty</h3>
          <p className="text-xs text-slate-500 leading-relaxed">
            Pick delicious burgers, fresh dosas, cool smoothies or meals from the campus food menu.
          </p>
          <button
            onClick={() => onNavigate('menu')}
            className="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-purple-600/30 transition"
          >
            Browse Food Menu
          </button>
        </div>
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Items List (2 Cols) */}
          <div className="lg:col-span-2 space-y-3">
            {cartItems.map(cartItem => {
              const food = window.CafeteriaData.foodItems.find(f => f.id === cartItem.itemId);
              if (!food) return null;
              const itemTotal = food.price * cartItem.quantity;

              return (
                <div
                  key={food.id}
                  className="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs flex items-center justify-between gap-4 hover:border-purple-200 transition"
                >
                  <div className="flex items-center space-x-3.5 min-w-0">
                    <img
                      src={food.image}
                      alt={food.name}
                      className="w-16 h-16 rounded-xl object-cover shrink-0"
                      onError={(e) => {
                        e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';
                      }}
                    />
                    <div className="min-w-0">
                      <div className="flex items-center space-x-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                        <h4 className="font-extrabold text-slate-900 text-sm truncate">{food.name}</h4>
                      </div>
                      <span className="text-xs text-slate-400 block mt-0.5">{food.counter}</span>
                      <span className="text-xs font-black text-slate-900 mt-1 block">
                        ₹{food.price} <span className="text-slate-400 font-normal">× {cartItem.quantity} = ₹{itemTotal}</span>
                      </span>
                    </div>
                  </div>

                  {/* Quantity Stepper: Customer can increase or decrease amount */}
                  <div className="flex items-center space-x-3 shrink-0">
                    <QuantityControl
                      quantity={cartItem.quantity}
                      onIncrease={() => onIncreaseQty(food.id)}
                      onDecrease={() => onDecreaseQty(food.id)}
                      size="md"
                    />
                    <button
                      onClick={() => {
                        window.SoundFX.play('remove');
                        onRemoveItem(food.id);
                      }}
                      className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition"
                      title="Remove item"
                    >
                      <window.Icons.Trash className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              );
            })}

            {/* Eco-Friendly Cutlery Preference */}
            <div className="bg-white rounded-2xl p-4 border border-slate-200/80 flex items-center justify-between text-xs">
              <div className="flex items-center space-x-2.5">

              />

          </div>

          {/* Right Column: Bill Summary & Checkout */}
          <div className="space-y-4">
            <BillSummaryCard
              subtotal={subtotal}
              gst={gst}
              total={total}
              discount={discountAmount}
              couponCode={couponCode}
              onApplyCoupon={handleApplyCoupon}

            <button
              onClick={() => {
                window.SoundFX.play('click');

              <span>Proceed to Checkout & Billing</span>
              <window.Icons.ChevronRight className="w-4 h-4" />
            </button>

            <button
              onClick={() => onNavigate('menu')}
              className="w-full py-2.5 text-center text-xs font-bold text-slate-600 hover:text-purple-600"
            >
              + Add More Food Items
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// 16. Login, Registration & Student ID Authentication Page
function LoginScreen({ onLoginSuccess }) {
  const [authMode, setAuthMode] = React.useState('login'); // 'login' | 'register'
  const [email, setEmail] = React.useState('kumud.negi@college.edu');
  const [password, setPassword] = React.useState('password123');
  const [showPassword, setShowPassword] = React.useState(false);
  const [isSubmitting, setIsSubmitting] = React.useState(false);
  const [feedback, setFeedback] = React.useState(null);

  // New Registration form fields
  const [regName, setRegName] = React.useState('');
  const [regEmail, setRegEmail] = React.useState('');
  const [regRoll, setRegRoll] = React.useState('');
  const [regDept, setRegDept] = React.useState('CSE - 1st Year');
  const [regDiet, setRegDiet] = React.useState('veg');

  // Connection check state
  const [healthStatus, setHealthStatus] = React.useState(null);
  const [isCheckingHealth, setIsCheckingHealth] = React.useState(false);

  const checkConnection = async () => {
    setIsCheckingHealth(true);
    window.SoundFX.play('click');
    const res = await window.CafeteriaAPI.checkDetailedHealth();
    setHealthStatus(res);
    setIsCheckingHealth(false);
  };

  const handleLoginSubmit = async (e, customEmail = null, customPass = null, provider = 'credentials') => {
    if (e) e.preventDefault();
    window.SoundFX.play('success');
    setIsSubmitting(true);
    setFeedback(null);

    const loginId = customEmail || email;
    const loginPwd = customPass || password;

    if (window.CafeteriaAPI && window.CafeteriaAPI.isOnline) {
      try {
        const res = await window.CafeteriaAPI.login(loginId, loginPwd, provider);
        if (res && res.success && res.user) {
          setIsSubmitting(false);
          onLoginSuccess(res.user);
          return;
        } else {
          setFeedback({ type: 'error', text: res?.message || 'Login failed' });
        }
      } catch (err) {
        setFeedback({ type: 'error', text: 'Error contacting Flask server: ' + err.message });
      }
    } else {
      // Offline fallback
      setIsSubmitting(false);
      onLoginSuccess();
      return;
    }
    setIsSubmitting(false);
  };

  const handleRegisterSubmit = async (e) => {
    if (e) e.preventDefault();
    window.SoundFX.play('success');
    setIsSubmitting(true);
    setFeedback(null);

    if (!regName.trim() || !regEmail.trim()) {
      setFeedback({ type: 'error', text: 'Please fill in all required fields' });
      setIsSubmitting(false);
      return;
    }

    const payload = {
      name: regName.trim(),
      email: regEmail.trim(),
      roll_number: regRoll.trim() || `STU-2026-${Math.floor(1000 + Math.random() * 9000)}`,
      department: regDept,
      diet: regDiet,
      password: password
    };

    if (window.CafeteriaAPI && window.CafeteriaAPI.isOnline) {
      try {
        const res = await window.CafeteriaAPI.register(payload);
        if (res && res.success && res.user) {
          setIsSubmitting(false);
          setFeedback({ type: 'success', text: res.message });
          setTimeout(() => {
            onLoginSuccess(res.user);
          }, 800);
          return;
        } else {
          setFeedback({ type: 'error', text: res?.message || 'Registration failed' });
        }
      } catch (err) {
        setFeedback({ type: 'error', text: 'Backend error: ' + err.message });
      }
    } else {
      // Offline fallback: create local user
      const localUser = {
        id: 'user-' + Date.now(),
        name: payload.name,
        fullName: payload.name,
        email: payload.email,
        phone: '+91 98765 00000',
        studentId: payload.roll_number,
        department: payload.department,
        year: 1,
        diet: payload.diet,
        walletBalance: 500.00,
        rewardPoints: 100,
        avatar: 'assets/avatar.jpg'

      setIsSubmitting(false);
      onLoginSuccess(localUser);
      return;
    }
    setIsSubmitting(false);
  };

  return (
    <div className="max-w-md mx-auto space-y-5 animate-fade-in py-6">

        <div className="flex items-center space-x-2.5">
          <span className={`w-3 h-3 rounded-full ${window.CafeteriaAPI.isOnline ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
          <div>
            <span className="text-xs font-bold block">
              {window.CafeteriaAPI.isOnline ? '🟢 Connected to Backend & SQLite' : '🟡 Standalone Offline Mode'}
            </span>
            <span className="text-[10px] text-slate-400">
              {window.CafeteriaAPI.isOnline ? 'Direct reads/writes to cafeteria.db' : 'Using mock client state'}
            </span>
          </div>
        </div>
        <button
          onClick={checkConnection}

          <span>{isCheckingHealth ? 'Pinging...' : 'Test Connection'}</span>

      </div>

      {/* Detailed Diagnostic Pop-out if tested */}
      {healthStatus && (

      {/* Main Card */}

          <p><strong>Pickup PIN:</strong> {activeOrder?.verificationPin || '4829'}</p>
          <hr style={{ borderTop: '1px dashed #000' }} />
          <table style={{ width: '100%', fontSize: '13px', margin: '12px 0' }}>
            <thead>
              <tr style={{ borderBottom: '1px dashed #000' }}>
                <th style={{ textAlign: 'left', padding: '4px 0' }}>Item</th>
                <th style={{ textAlign: 'center' }}>Qty</th>
                <th style={{ textAlign: 'right' }}>Price</th>
              </tr>
            </thead>
            <tbody>
              {(activeOrder?.items || []).map((i, idx) => (
                <tr key={idx}>
                  <td style={{ padding: '4px 0' }}>{i.name}</td>
                  <td style={{ textAlign: 'center' }}>{i.qty}</td>
                  <td style={{ textAlign: 'right' }}>₹{(i.price * i.qty).toFixed(2)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <hr style={{ borderTop: '1px dashed #000' }} />
          <p style={{ display: 'flex', justifyContent: 'space-between', margin: '4px 0' }}>
            <span>Subtotal:</span>
            <span>₹{activeOrder?.subtotal?.toFixed(2) || '195.00'}</span>
          </p>
          <p style={{ display: 'flex', justifyContent: 'space-between', margin: '4px 0' }}>
            <span>GST (5%):</span>
            <span>₹{activeOrder?.gst?.toFixed(2) || '9.75'}</span>
          </p>
          <p style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 'bold', fontSize: '15px', margin: '8px 0' }}>
            <span>Total Paid:</span>
            <span>₹{activeOrder?.total?.toFixed(2) || '204.75'}</span>
          </p>
          <p style={{ margin: '4px 0' }}><strong>Payment Method:</strong> {activeOrder?.paymentMethod || 'Campus Meal Card'}</p>
          <hr style={{ borderTop: '1px dashed #000' }} />
          <p style={{ textAlign: 'center', fontSize: '11px', marginTop: '16px' }}>
            Please show your digital QR Token or this slip at the pickup counter to collect your ready meal!
          </p>
        </div>
      </div>
    </div>
  );
}

// Mount React Root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);



  </script>
</body>
</html>
