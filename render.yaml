databases:
  - name: foodbooth-db
    databaseName: foodbooth
    user: foodbooth_user
    plan: free
    region: singapore

services:
  - type: web
    name: foodbooth
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodbooth-db
          property: connectionString
